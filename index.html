<script>
// =====================================================================
// ===== THÔNG SỐ — SỬA Ở ĐÂY =====
// Đây là thông số MẶC ĐỊNH khi dùng app lần đầu.
// Lưu ý: sau này nếu bạn sửa trong màn "Cài đặt" của app, app sẽ dùng số
// trong Cài đặt (lưu trên máy), không dùng số ở đây nữa.
// =====================================================================
const CONFIG = {
  SL: 150,              // Cắt lỗ mỗi lệnh (Stop Loss), $
  P1_TARGET: 8,         // Mục tiêu Vòng 1, % vốn ban đầu
  P2_TARGET: 6,         // Mục tiêu Vòng 2, % vốn ban đầu
  DAILY_DD: 4,          // Sụt giảm ngày (Daily drawdown), %
  MAX_DD: 10,           // Sụt giảm tối đa (Max drawdown, static), % vốn ban đầu
  MIN_DAYS: 3,          // Số ngày lãi tối thiểu mỗi vòng
  MIN_DAYS_NEW: 4,      // Số ngày lãi mỗi kỳ payout funded (tài khoản mua từ NEW_RULE_DATE)
  NEW_RULE_DATE: "2026-07-25", // Ngày bắt đầu áp luật 4 ngày lãi (năm-tháng-ngày)
  DAY_WIN: 0.5,         // Ngưỡng ngày lãi, % vốn ban đầu (5k -> $25)
  PLAN_NEXT_TP: 50,     // Kế hoạch của thầy: TP các ngày sau, $. Ngày đầu TP = phần còn thiếu trừ đi các ngày sau
                        //   (Vòng 1: 400 - 2x50 = $300; Vòng 2: 300 - 2x50 = $200; thua thì TP tự nâng lên)
  GOAT_GUARD: 2,        // Ngưỡng Goat Guard, % vốn ban đầu (5k -> $100)
  // --- Chiến lược vòng Funded (theo thầy) ---
  FUNDED_SL: 80,        // SL mỗi lệnh ở Funded, $ (thầy: 75-80, khoảng 1.5% vì quỹ chỉ cho tối đa 2%)
  FUNDED_TARGET: 190,   // Lãi mỗi kỳ rút, $ (thầy: tầm 190-199 thì rút)
  FUNDED_NEXT_TP: 30,   // TP các ngày sau ở Funded, $ (ngày đầu = 190 - 3x30 = $100; thua thì cộng dồn vào TP này)
  FUNDED_LOT: "0.05–0.06", // Lot gợi ý ở Funded (chỉ để hiển thị)
  // --- Phí giao dịch (commission), app tự trừ mỗi khi ghi kết quả ---
  COMMISSION_PER_LOT: 5, // Phí cho mỗi 1 lot, $ (0.06 lot ≈ $0.30)
  LOT_CHALLENGE: 0.13,  // Lot thường đánh ở Vòng 1 và Vòng 2 -> phí ≈ $0.65/lệnh
  LOT_FUNDED: 0.06,     // Lot thường đánh ở Funded -> phí ≈ $0.30/lệnh
  PAYOUT_SPLIT: 100,    // Tỷ lệ chia lợi nhuận (Profit split), %. Bạn mua add-on 100%
  PAYOUT_FIRST_DAYS: 14, // Số ngày sau khi lên Funded mới được rút lần đầu
  PAYOUT_CAP: 6,        // Trần mỗi lần rút ở 2 lần rút đầu, % vốn ban đầu (5k -> $300)
  PAYOUT_WARN_DAYS: 2,  // GFT cam kết chi trả trong số NGÀY LÀM VIỆC này (không tính T7, CN); trễ hơn thì được thêm $1,000
  PAYOUT_FEE: 3,        // Phí xử lý mỗi lần rút, % (GFT: 3%) -> rút $190 về tay ~$184.30
  DAY_RESET_TZ: "America/New_York", // Múi giờ tính ngày giao dịch
  DAY_RESET_HOUR: 17,   // Giờ sang ngày mới theo New York (17 = 5PM)
  SIZES: [5000, 8000, 15000, 25000, 50000, 100000, 150000], // Các size tài khoản để chọn khi thêm
  DIR_MAX_STREAK: 2,    // Chống đánh 1 chiều: cùng hướng (Buy/Sell) tối đa bao nhiêu ngày liền.
                        //   Đạt mức này thì lệnh tiếp theo BẮT BUỘC đổi hướng. 1 ngày thì chỉ nhắc nên đổi.
  // Lưu lên mây (Supabase). Để trống 2 dòng này thì app chỉ lưu trên máy như cũ.
  CLOUD_URL: "https://mjaqqcnznzkyhglvmzku.supabase.co", // Project URL, ví dụ "https://abcdxyz.supabase.co"
  CLOUD_KEY: "sb_publishable_DEdPent6z6l2xXc7VmsGUg_JpVUn0UJ" // publishable key (khoá công khai của project)
};
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GFT Tracker">
<title>GFT Tracker</title>
<style>
:root{
  --bg:#f3f4f7; --card:#ffffff; --text:#15171c; --muted:#5d6470; --line:#dfe3e9; --chip:#eceff3;
  --accent:#1f5eff;
  --green:#12803c; --green-bg:#e2f5e9;
  --red:#cf2a1e; --red-bg:#fdeceb;
  --yellow:#8a5d00; --yellow-bg:#fff2cf;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1014; --card:#181b21; --text:#eef0f3; --muted:#9aa3af; --line:#2b3038; --chip:#232830;
    --accent:#4d7dff;
    --green:#41d17a; --green-bg:#12301f;
    --red:#ff6b60; --red-bg:#3a1614;
    --yellow:#f5c451; --yellow-bg:#352a0d;
    --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1014; --card:#181b21; --text:#eef0f3; --muted:#9aa3af; --line:#2b3038; --chip:#232830;
  --accent:#4d7dff;
  --green:#41d17a; --green-bg:#12301f;
  --red:#ff6b60; --red-bg:#3a1614;
  --yellow:#f5c451; --yellow-bg:#352a0d;
  --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
b,.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.pos{color:var(--green)}
.neg{color:var(--red)}

header{margin-bottom:12px}
header h1{font-size:22px;margin:0 0 2px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hbtns{display:flex;gap:8px;flex:none}
.hbtn{min-height:44px;min-width:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.hbtn.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.st-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.st-card h2{font-size:17px;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:520px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--bg);border-radius:12px;padding:10px 12px}
.kpi .k{font-size:14px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .s{font-size:13px;color:var(--muted)}
.st-tbl{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.st-tbl th,.st-tbl td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
.st-tbl th:first-child,.st-tbl td:first-child{text-align:left}
.st-tbl th{font-size:13px;color:var(--muted);font-weight:600}
.wrbar{height:8px;border-radius:999px;background:var(--red-bg);overflow:hidden;margin-top:6px}
.wrbar i{display:block;height:100%;background:var(--green)}
.st-sel{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:4px}
.eq svg{width:100%;height:auto;display:block}
.note{font-size:14px;color:var(--muted);margin-top:8px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--chip);border-radius:14px;padding:4px;margin-bottom:12px}
.tab{min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:inherit;font-size:15px;font-weight:600;cursor:pointer;padding:0 4px}
.tab.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
details.more{border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:14px}
details.more summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:600;font-size:15px}
details.more[open]{padding-bottom:4px}
.dirline{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:4px}
.dirline .cnt b.L{color:var(--green)} .dirline .cnt b.S{color:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin:-4px 0 12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.cal-head b{font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .hd{text-align:center;font-size:13px;color:var(--muted);font-weight:600;padding-bottom:2px}
.cal .d{min-height:58px;border-radius:10px;background:var(--bg);padding:4px;font-size:13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cal .d.out{opacity:.3}
.cal .d.today{outline:2px solid var(--accent)}
.cal .ev{font-size:11px;font-weight:700;border-radius:5px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.paid{background:var(--green);color:#fff}
.ev.pending{background:var(--yellow-bg);color:var(--yellow)}
.ev.elig{color:var(--accent);border:1px dashed var(--accent)}
.pay-acc{border-left:6px solid var(--green)}
.pay-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.pay-row .r{display:flex;gap:6px;flex:none}
.daybar{color:var(--muted);font-size:15px}

.banner{border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.banner.red{background:var(--red-bg);color:var(--red)}

.overview{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.ov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;text-align:center}
.ov-grid div{padding:4px 0}
.ov-grid b{display:block;font-size:22px;line-height:1.2}
.ov-grid span{font-size:15px;color:var(--muted)}
.ov-line{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;border-top:1px solid var(--line);margin-top:10px;padding-top:10px;font-size:15px}
.ov-todo{font-weight:600}
.ov-todo.has{color:var(--yellow)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 12px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:15px;cursor:pointer}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}

.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);border-left:8px solid var(--acc);padding:14px 14px 12px;margin-bottom:12px}
.card.done{opacity:.62}
.card.dead{opacity:.55}
.card.passed{border-left-color:var(--green)}
.tag.tag-pass{background:var(--green);color:#fff}
.c-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.c-name{font-size:18px;font-weight:700}
.c-sub{font-size:15px;color:var(--muted)}
.idbtn{font:inherit;font-size:15px;color:var(--muted);background:none;border:0;padding:6px 0;min-height:32px;cursor:pointer;font-variant-numeric:tabular-nums}
.idbtn b{color:var(--text)}
.idbtn .cp{font-size:14px;margin-left:2px}
textarea{width:100%;min-height:96px;font:inherit;font-size:18px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);resize:vertical;font-variant-numeric:tabular-nums}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.pv{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.pv i{flex:none;width:16px;height:16px;border-radius:999px}
.pv .w{color:var(--red);font-weight:600}
.pv.skip{opacity:.55}
.tag{flex:none;font-size:14px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--chip)}
.tag-F{background:var(--green-bg);color:var(--green)}
.tag-dead{background:var(--red-bg);color:var(--red)}
.c-bal{margin:10px 0 6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.c-bal .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.c-bal .chg{font-size:17px;font-weight:600}
.bar{height:10px;border-radius:999px;background:var(--chip);overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:999px}
.row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 12px;font-size:15px;margin:4px 0}
.row.sub{color:var(--muted)}
.row.sub b{color:var(--text)}
.dots{letter-spacing:2px;color:var(--green)}
.dots .off{color:var(--line)}
.alert{border-radius:10px;padding:8px 12px;margin-top:8px;font-size:15px;font-weight:600}
.alert.red{background:var(--red-bg);color:var(--red)}
.alert.green{background:var(--green-bg);color:var(--green)}
.alert.yellow{background:var(--yellow-bg);color:var(--yellow)}
.plan{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px;background:var(--chip)}
.plan b{font-size:17px}
.pill{display:inline-block;border-radius:999px;padding:4px 12px;font-size:15px;font-weight:600;margin-top:10px}
.pill.yellow{background:var(--yellow-bg);color:var(--yellow)}
.pill.green{background:var(--green-bg);color:var(--green)}
.pill.grey{background:var(--chip);color:var(--muted)}
.pill.red{background:var(--red-bg);color:var(--red)}
.c-btns{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-top:12px}
.c-btns .btn{padding:0 8px}
.order{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px;border:2px dashed var(--yellow);background:var(--yellow-bg);color:var(--text)}
.order.run{border-style:solid;border-color:var(--accent);background:var(--chip)}
.order .ot{font-weight:800;font-size:16px}
.order .ot.L{color:var(--green)} .order .ot.S{color:var(--red)}
.order .od{color:var(--muted);margin-top:2px}
.order .ow{color:var(--red);font-weight:700;margin-top:4px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4 button{min-height:54px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:16px;font-weight:700;cursor:pointer;line-height:1.2}
.grid4 button small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.grid4 button.on.g{background:var(--green);border-color:var(--green);color:#fff}
.grid4 button.on.r{background:var(--red);border-color:var(--red);color:#fff}
.grid4 button.on small{color:inherit;opacity:.85}
.ov-orders{display:grid;gap:6px;border-top:1px solid var(--line);margin-top:10px;padding-top:10px;font-size:15px}
.ov-orders .oi{display:flex;align-items:center;gap:8px}
.ov-orders .oi i{flex:none;width:12px;height:12px;border-radius:999px}

.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--text);font:inherit;font-weight:600;padding:0 16px;cursor:pointer;width:100%}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.danger{background:var(--red-bg);color:var(--red);border-color:transparent}
.btn.armed{background:var(--red);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{min-height:44px;width:auto;padding:0 12px;font-size:15px}
.foot{display:grid;gap:10px;margin-top:16px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:24px 16px;text-align:center;color:var(--muted)}
.saved-at{text-align:center;color:var(--muted);font-size:14px;margin-top:14px}

/* Cửa sổ trượt từ dưới lên */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sheet{position:relative;width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:0 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:20px}}
.sh-head{position:sticky;top:0;background:var(--card);display:flex;justify-content:space-between;align-items:center;padding:14px 0 10px;z-index:2}
.sh-head h2{font-size:19px;margin:0}
.x{min-width:44px;min-height:44px;border:0;background:var(--chip);color:var(--text);border-radius:999px;font-size:20px;cursor:pointer}
.idblock{margin:0 -16px 16px;padding:22px 16px;background:var(--acc);color:var(--on)}
.idblock .l1{font-size:24px;font-weight:800;line-height:1.2}
.idblock .l2{font-size:18px;font-weight:600;margin-top:4px}
.field{margin-bottom:14px}
.field>label,.field>.lbl{display:block;font-size:15px;font-weight:600;margin-bottom:6px}
.hint{font-size:14px;color:var(--muted);margin-top:4px}
.hint.warn{color:var(--red)}
input,select{width:100%;min-height:50px;font:inherit;font-size:18px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
input:disabled,select:disabled{opacity:.6}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:54px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:18px;font-weight:700;cursor:pointer}
.seg button.on.g{background:var(--green);border-color:var(--green);color:#fff}
.seg button.on.r{background:var(--red);border-color:var(--red);color:#fff}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:44px;height:44px;border-radius:999px;border:3px solid transparent;cursor:pointer;position:relative}
.sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--card) inset}
.sw.used::after{content:"";position:absolute;right:-2px;top:-2px;width:12px;height:12px;border-radius:999px;background:var(--card);border:2px solid var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary{background:var(--chip);border-radius:12px;padding:12px;font-size:16px;margin-bottom:12px}
.err{color:var(--red);font-weight:600;margin-bottom:10px;font-size:15px}
.list{border-top:1px solid var(--line);margin-top:8px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
h3{font-size:16px;margin:22px 0 4px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:80;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="backdrop" data-action="close"></div>
  <div class="sheet" role="dialog" aria-modal="true" id="sheetBody"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
const STORE_KEY = 'gft-tracker-v1';
// Màu tài khoản theo hướng lệnh gần nhất (chống đánh 1 chiều)
const DIR_COLORS = { none:'#64748b', L1:'#4ade80', L2:'#15803d', S1:'#f87171', S2:'#b91c1c' };
const DIR_NAME = { L:'Buy', S:'Sell' };
const PHASES = { P1:'Vòng 1', P2:'Vòng 2', F:'Funded' };
const WD = ['CN','T2','T3','T4','T5','T6','T7'];

let storageOk = true;
let data = load();
const ui = { filter:'active', rec:null, form:null, ord:null, pay:null, view:'main', stAcc:'all', stPhase:'all', payMonth:'' };
// Giao diện sáng/tối: auto (theo máy) -> light -> dark, nhớ trên máy này
const THEMES = ['auto', 'light', 'dark'], THEME_ICON = { auto:'🌓', light:'☀️', dark:'🌙' };
function getTheme(){ try { return localStorage.getItem('gft-theme') || 'auto'; } catch(e){ return 'auto'; } }
function applyTheme(t){
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('gft-theme', t); } catch(e){}
}
applyTheme(getTheme());
function headerButtons(){
  const t = getTheme();
  return `<div class="hbtns">${syncBadge()}<button class="hbtn" data-action="theme" title="Giao diện: ${t === 'auto' ? 'theo máy' : t === 'light' ? 'sáng' : 'tối'}">${THEME_ICON[t]}</button></div>`;
}
// 3 trang tách biệt: Tài khoản (chính) · Thống kê · Payout
function topNav(){
  return `<nav class="tabs">${[['main','🏠 Tài khoản'],['stats','📊 Thống kê'],['payout','💸 Payout']]
    .map(([k, t]) => `<button class="tab ${ui.view === k ? 'on' : ''}" data-action="view" data-v="${k}">${t}</button>`).join('')}</nav>`;
}

// ---------- Lưu / đọc dữ liệu ----------
function load(){
  let d = null;
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) d = JSON.parse(raw); }
  catch(e){ storageOk = false; }
  return normalize(d);
}
function normalize(d){
  d = (d && typeof d === 'object') ? d : {};
  const saved = d.settings || {};
  const settings = { ...CONFIG, ...saved };
  delete settings.ACCOUNT_PRICES; delete settings.COMBO_PRICES;   // bản cũ: giá tự điền, nay nhập tay
  delete settings.CLOUD_URL; delete settings.CLOUD_KEY;           // cấu hình máy chủ luôn lấy từ CONFIG
  return {
    version: 1,
    settings,
    // Bản cũ chỉ lưu 4 số cuối (login4); bản mới lưu nguyên ID (loginId)
    accounts: (Array.isArray(d.accounts) ? d.accounts : []).map(a => ({ ...a, loginId: a.loginId || a.login4 || '', login4: last4(a.loginId || a.login4) })),
    results:  Array.isArray(d.results)  ? d.results  : [],
    payouts:  Array.isArray(d.payouts)  ? d.payouts  : [],
    updatedAt: d.updatedAt || 0
  };
}
function save(){
  data.updatedAt = Date.now();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); storageOk = true; }
  catch(e){ storageOk = false; }
  schedulePush();
  render();
}

// ---------- Tiện ích ----------
const S = () => data.settings;
const accById = id => data.accounts.find(a => a.id === id);
// Tài khoản còn đang đánh (chưa cháy, chưa hoàn thành)
const isLive = a => (a.status || 'active') === 'active';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const r2 = x => Math.round((+x || 0) * 100) / 100;
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtNum(n){ return Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); }
function money(x){ const n = r2(x); return (n < 0 ? '−' : '') + '$' + fmtNum(n); }
function signed(x){ const n = r2(x); return (n > 0 ? '+' : n < 0 ? '−' : '') + '$' + fmtNum(n); }
function sizeLabel(size){ return (+size >= 1000 ? (+size / 1000) + 'k' : size); }
// ID tài khoản = số login MT5, chỉ giữ chữ số
function cleanId(s){ return String(s ?? '').replace(/\D/g, ''); }
function last4(id){ return cleanId(id).slice(-4); }
// Tách các ID từ đoạn văn bản dán vào: mỗi cụm chỉ gồm chữ số, dài 4–15 số
function parseIds(text){
  const out = [];
  for (const t of String(text || '').split(/[\s,;|]+/)){
    const tok = t.replace(/^[^\w]+|[^\w]+$/g, '').replace(/^#/, '');
    if (/^\d{4,15}$/.test(tok) && !out.includes(tok)) out.push(tok);
  }
  return out;
}
function idHtml(id){ const c = cleanId(id); return c.length > 4 ? esc(c.slice(0, -4)) + '<b>' + esc(c.slice(-4)) + '</b>' : '<b>' + esc(c) + '</b>'; }
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(_){}
    ta.remove(); return ok;
  }
}
function textOn(hex){
  const h = hex.replace('#',''); const r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  return (0.299*r + 0.587*g + 0.114*b) > 165 ? '#111' : '#fff';
}

// ---------- Thời gian & ngày giao dịch (mốc 5PM New York) ----------
function now(){ return window.__NOW != null ? +new Date(window.__NOW) : Date.now(); } // __NOW chỉ dùng để test
function nyParts(ms){
  const f = new Intl.DateTimeFormat('en-US', { timeZone:S().DAY_RESET_TZ, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23' });
  const p = {}; for (const x of f.formatToParts(new Date(ms))) p[x.type] = x.value;
  return { date:`${p.year}-${p.month}-${p.day}`, hour:(+p.hour) % 24, minute:+p.minute, second:+p.second };
}
function ymd(ds){ return ds.split('-').map(Number); }
function addDays(ds, n){ const [y,m,d] = ymd(ds); return new Date(Date.UTC(y, m-1, d+n)).toISOString().slice(0,10); }
function dow(ds){ const [y,m,d] = ymd(ds); return new Date(Date.UTC(y, m-1, d)).getUTCDay(); }
function daysBetween(a, b){ const t = s => { const [y,m,d] = ymd(s); return Date.UTC(y, m-1, d); }; return Math.round((t(b) - t(a)) / 864e5); }
// Thứ 7 / Chủ nhật không có phiên -> dồn sang thứ 2
function rollWeekend(ds){ const w = dow(ds); return w === 6 ? addDays(ds, 2) : w === 0 ? addDays(ds, 1) : ds; }
function tradingDayAt(ms){
  const p = nyParts(ms);
  return rollWeekend(p.hour >= S().DAY_RESET_HOUR ? addDays(p.date, 1) : p.date);
}
// Từ 5PM thứ 6 tới 5PM chủ nhật (giờ New York) coi là nghỉ cuối tuần
function marketClosedAt(ms){
  const p = nyParts(ms), w = dow(p.date), h = S().DAY_RESET_HOUR;
  return (w === 5 && p.hour >= h) || w === 6 || (w === 0 && p.hour < h);
}
function nextResetMs(ms){
  const p = nyParts(ms), [y,m,d] = ymd(p.date);
  const offset = Date.UTC(y, m-1, d, p.hour, p.minute, p.second) - Math.floor(ms / 1000) * 1000;
  let target = Date.UTC(y, m-1, d, S().DAY_RESET_HOUR, 0, 0);
  if (p.hour >= S().DAY_RESET_HOUR) target += 864e5;
  return target - offset;
}
function localDate(ms){ const t = new Date(ms); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; }
function fmtDay(ds){ if (!ds) return ''; const [, m, d] = ds.split('-'); return `${WD[dow(ds)]} ${d}/${m}`; }
function fmtTime(ms){ const t = new Date(ms); return `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`; }
function fmtStamp(ms){ const t = new Date(ms); return `${fmtTime(ms)} ${String(t.getDate()).padStart(2,'0')}/${String(t.getMonth()+1).padStart(2,'0')}`; }

// ---------- Công thức (mục 6 spec) ----------
function compute(acc, today){
  const s = S(), size = +acc.size;
  const res = data.results.filter(r => r.accountId === acc.id && r.phase === acc.phase);
  const trades = res.filter(r => r.kind !== 'adjust');               // dòng "đối chiếu số dư" không tính là lệnh
  const pays = acc.phase === 'F' ? data.payouts.filter(p => p.accountId === acc.id) : [];
  const balance = r2(size + res.reduce((t, r) => t + +r.pnl, 0) - pays.reduce((t, p) => t + +p.amount, 0));
  const profit = r2(balance - size);
  const target = acc.phase === 'P1' ? r2(size * s.P1_TARGET / 100) : acc.phase === 'P2' ? r2(size * s.P2_TARGET / 100) : r2(+s.FUNDED_TARGET || 0);
  const remain = Math.max(0, r2(target - profit));
  const lastPay = pays.map(p => p.requestDate).sort().pop() || '';
  const dayPnl = {};
  for (const r of trades){
    if (lastPay && r.tradingDay <= lastPay) continue;               // Funded: chỉ đếm ngày sau payout gần nhất
    dayPnl[r.tradingDay] = r2((dayPnl[r.tradingDay] || 0) + +r.pnl);
  }
  const winDays = Object.values(dayPnl).filter(v => v >= r2(size * s.DAY_WIN / 100)).length;
  const minDays = (acc.phase === 'F' && acc.purchaseDate && acc.purchaseDate >= s.NEW_RULE_DATE) ? s.MIN_DAYS_NEW : s.MIN_DAYS;
  const floor = r2(size * (1 - s.MAX_DD / 100));
  const buffer = r2(balance - floor);
  const sl = slFor(acc);
  const slLeft = buffer > 0 ? Math.ceil(buffer / sl - 1e-9) - 1 : 0;   // số lệnh SL còn chịu được mà chưa chạm sàn
  const todayTrades = trades.filter(r => r.tradingDay === today);
  const ready = acc.phase !== 'F' && remain <= 0 && winDays >= minDays;
  // Kế hoạch TP hôm nay: các ngày còn lại mỗi ngày PLAN_NEXT_TP, hôm nay gánh phần còn thiếu
  const daysLeft = Math.max(1, minDays - winDays);
  const planNext = Math.max(acc.phase === 'F' ? +s.FUNDED_NEXT_TP || 0 : +s.PLAN_NEXT_TP || 0, r2(size * s.DAY_WIN / 100));
  // Funded: đủ lãi kỳ này và đủ ngày lãi thì dừng, đi rút tiền
  const payReady = acc.phase === 'F' && remain <= 0 && winDays >= minDays;
  const planTP = ready || payReady ? 0 : r2(Math.max(planNext, remain - (daysLeft - 1) * planNext));
  const fundedDays = acc.phase === 'F' && acc.fundedDate ? daysBetween(acc.fundedDate, localDate(now())) : null;
  return { balance, profit, target, remain, winDays, minDays, floor, buffer, slLeft, ready, payReady, sl, fundedDays, daysLeft, planNext, planTP,
           tradedToday: todayTrades.length > 0, todayPnl: r2(todayTrades.reduce((t, r) => t + +r.pnl, 0)) };
}

// SL theo vòng: Funded dùng SL nhỏ hơn (quỹ giới hạn rủi ro 2%)
function slFor(acc){ return acc && acc.phase === 'F' ? +S().FUNDED_SL || +S().SL : +S().SL; }

// ---------- Trang chính ----------
function render(){
  if (cloudOn() && !sess.hash) return renderLogin();
  if (ui.view === 'stats') return renderStats();
  if (ui.view === 'payout') return renderPayout();
  const ms = now(), today = tradingDayAt(ms), closed = marketClosedAt(ms);
  const accs = data.accounts;
  const comp = new Map(accs.map(a => [a.id, compute(a, today)]));
  const active = accs.filter(isLive);
  const nPassed = accs.filter(a => a.status === 'passed').length, nDead = accs.filter(a => a.status === 'breached').length;
  const cnt = { P1:0, P2:0, F:0 }; active.forEach(a => cnt[a.phase]++);
  const notTraded = closed ? 0 : active.filter(a => !comp.get(a.id).tradedToday).length;
  const cost = accs.reduce((t, a) => t + (+a.cost || 0), 0);
  const paid = data.payouts.filter(p => p.status === 'paid').reduce((t, p) => t + (+(p.received ?? p.amount) || 0), 0);

  let h = `<header><div class="hrow"><h1>GFT Tracker</h1>${headerButtons()}</div><div class="daybar">`;
  h += closed
    ? `Cuối tuần, thị trường đóng · Ngày giao dịch tiếp theo: <b>${fmtDay(today)}</b>`
    : `Ngày giao dịch: <b>${fmtDay(today)}</b> · sang ngày mới lúc <b>${fmtTime(nextResetMs(ms))}</b> (giờ máy)`;
  h += `</div></header>` + topNav();
  if (!storageOk) h += `<div class="banner red">⚠ Không lưu được dữ liệu trên trình duyệt này (có thể đang ở chế độ ẩn danh). Dữ liệu sẽ mất khi đóng trang.</div>`;

  h += `<section class="overview">
    <div class="ov-grid">
      <div><b>${active.length}</b><span>Đang chạy</span></div>
      <div><b>${cnt.P1}</b><span>Vòng 1</span></div>
      <div><b>${cnt.P2}</b><span>Vòng 2</span></div>
      <div><b>${cnt.F}</b><span>Funded</span></div>
      <div><b>${nPassed}</b><span>Hoàn thành</span></div>
      <div><b>${nDead}</b><span>Cháy</span></div>
    </div>
    <div class="ov-line"><span class="ov-todo ${notTraded ? 'has' : ''}">${closed ? 'Cuối tuần — nghỉ' : `Chưa đánh hôm nay: ${notTraded}`}</span>
      <span>Lệnh đang mở: <b>${active.filter(a => a.openOrder).length}</b></span></div>
    ${ordersOverview(active, today)}
    <div class="ov-line"><span>Vốn đã bỏ ra <b>${money(cost)}</b></span><span>Payout đã về <b>${money(paid)}</b></span></div>
  </section>`;

  const chips = [['active','Đang chạy'],['P1','Vòng 1'],['P2','Vòng 2'],['F','Funded'],['passed','Hoàn thành'],['breached','Cháy']];
  h += `<nav class="chips">${chips.map(([k, t]) => `<button class="chip ${ui.filter === k ? 'on' : ''}" data-action="filter" data-v="${k}">${t}</button>`).join('')}</nav>`;

  const list = accs.filter(a => {
    if (ui.filter === 'breached' || ui.filter === 'passed') return a.status === ui.filter;
    if (!isLive(a)) return false;
    return ui.filter === 'active' || a.phase === ui.filter;
  }).sort((a, b) => {
    // Chưa đánh hôm nay lên trước; trong mỗi nhóm giữ thứ tự đánh cố định của bạn
    const ta = a.openOrder ? -1 : comp.get(a.id).tradedToday ? 1 : 0, tb = b.openOrder ? -1 : comp.get(b.id).tradedToday ? 1 : 0;
    return (ta - tb) || ((+a.order || 0) - (+b.order || 0)) || a.label.localeCompare(b.label);
  });

  if (list.length && ui.filter !== 'passed' && ui.filter !== 'breached')
    h += `<div class="legend"><span>Màu viền thẻ:</span><span><i style="background:${DIR_COLORS.L1}"></i>vừa Buy</span><span><i style="background:${DIR_COLORS.L2}"></i>quá Buy</span>
          <span><i style="background:${DIR_COLORS.S1}"></i>vừa Sell</span><span><i style="background:${DIR_COLORS.S2}"></i>quá Sell</span><span><i style="background:${DIR_COLORS.none}"></i>chưa đánh</span></div>`;
  if (!accs.length) h += `<div class="empty">Chưa có tài khoản nào.<br>Bấm <b>+ Thêm tài khoản</b> ở dưới để bắt đầu.</div>`;
  else if (!list.length) h += `<div class="empty">Không có tài khoản nào trong mục này.</div>`;
  else h += list.map(a => card(a, comp.get(a.id), closed)).join('');

  h += `<div class="foot"><button class="btn primary" data-action="add-account">+ Thêm tài khoản</button></div>`;
  if (data.updatedAt) h += `<div class="saved-at">${cloudOn() ? 'Dữ liệu lưu trên mây (đăng nhập bằng mã cá nhân)' : 'Dữ liệu lưu trên máy này'} · sửa lần cuối ${fmtStamp(data.updatedAt)}</div>`;
  document.getElementById('app').innerHTML = h;
}

function dots(won, need){
  let s = ''; const n = Math.max(won, need);
  for (let i = 0; i < n; i++) s += i < won ? '●' : '<span class="off">●</span>';
  return `<span class="dots">${s}</span>`;
}

function card(a, c, closed){
  const dead = !isLive(a), s = S();
  const tagTxt = a.status === 'breached' ? 'Đã cháy · ' + PHASES[a.phase] : a.status === 'passed' ? '✓ Đã pass ' + PHASES[a.phase] : PHASES[a.phase];
  const tagCls = a.status === 'breached' ? 'tag-dead' : a.status === 'passed' ? 'tag-pass' : 'tag-' + a.phase;
  let h = `<article class="card ${a.status === 'passed' ? 'passed' : dead ? 'dead' : (!closed && c.tradedToday ? 'done' : '')}" style="--acc:${dirColor(a)}">`;
  h += `<div class="c-top"><div><div class="c-name">${esc(a.label)}</div>
        <div class="c-sub">${sizeLabel(a.size)}${a.batchNo ? ' · Lô ' + a.batchNo : ''} · ${a.loginId
          ? `<button class="idbtn" data-action="copy-id" data-v="${esc(a.loginId)}" title="Bấm để sao chép ID">ID ${idHtml(a.loginId)} <span class="cp">⧉</span></button>`
          : 'chưa nhập ID'}</div></div>
        <span class="tag ${tagCls}">${tagTxt}</span></div>`;
  h += `<div class="c-bal"><span class="big">${money(c.balance)}</span>
        <span class="chg ${c.profit > 0 ? 'pos' : c.profit < 0 ? 'neg' : 'muted'}">${signed(c.profit)}</span></div>`;

  if (a.phase !== 'F'){
    const pct = c.target > 0 ? Math.max(0, Math.min(1, c.profit / c.target)) * 100 : 0;
    h += `<div class="bar"><i style="width:${pct}%"></i></div>`;
    h += `<div class="row"><span>${c.remain > 0 ? `Còn thiếu <b>${money(c.remain)}</b> / ${money(c.target)}` : `<b class="pos">Đã đạt mục tiêu ${money(c.target)}</b>`}</span>
          <span>Ngày lãi ${dots(c.winDays, c.minDays)} <b>${c.winDays}/${c.minDays}</b></span></div>`;
  } else {
    const pct = c.target > 0 ? Math.max(0, Math.min(1, c.profit / c.target)) * 100 : 0;
    h += `<div class="bar"><i style="width:${pct}%"></i></div>`;
    h += `<div class="row"><span>${c.remain > 0 ? `Lãi kỳ rút còn thiếu <b>${money(c.remain)}</b> / ${money(c.target)}` : `<b class="pos">Đủ lãi kỳ rút ${money(c.target)}</b>`}</span>
          <span>Ngày lãi ${dots(c.winDays, c.minDays)} <b>${c.winDays}/${c.minDays}</b></span></div>
          <div class="row sub"><span>Funded${c.fundedDays != null ? ` <b>${c.fundedDays}</b> ngày` : ''}</span><span>Lot gợi ý <b>${esc(s.FUNDED_LOT || '')}</b></span></div>`;
  }
  if (a.status !== 'passed') h += `<div class="row sub"><span>Đệm tới sàn (Buffer) <b>${money(c.buffer)}</b></span><span>Chịu thêm <b>${c.slLeft}</b> lệnh SL</span></div>`;

  if (!dead){
    if (c.slLeft <= 1) h += `<div class="alert red">⚠ Sát sàn: chỉ còn chịu ${c.slLeft} lệnh SL (sàn ${money(c.floor)})</div>`;
    if (c.ready) h += `<div class="alert green">✓ Đủ điều kiện lên vòng — bấm Quản lý để Pass</div>`;
    if (c.payReady) h += `<div class="alert green">✓ Đủ ${money(c.target)} và ${c.minDays} ngày lãi — dừng đánh, vào trang 💸 Payout để rút</div>`;
    if (a.phase === 'F' && c.sl > a.size * s.GOAT_GUARD / 100)
      h += `<span class="pill red">Goat Guard: SL ${money(c.sl)} > ngưỡng ${money(a.size * s.GOAT_GUARD / 100)}</span> `;
    // Kế hoạch TP: đã đánh hôm nay thì hiện luôn TP cho ngày mai (thua thì TP tự nâng lên)
    if (c.planTP && !a.openOrder){
      const when = c.tradedToday ? 'ngày mai' : closed ? 'ngày tới' : 'hôm nay';
      const steps = [c.planTP, ...Array(c.daysLeft - 1).fill(c.planNext)].map(money).join(' → ');
      h += `<div class="plan">🎯 TP ${when}: <b class="pos">${money(c.planTP)}</b> · SL <b class="neg">${money(c.sl)}</b>${a.phase === 'F' ? ` · lot ${esc(s.FUNDED_LOT || '')}` : ''}
            <br><span class="muted">Còn thiếu ${money(c.remain)} · lộ trình ${c.daysLeft} ngày lãi: ${steps}</span></div>`;
    }
    if (closed) h += `<span class="pill grey">Cuối tuần — thị trường đóng</span>`;
    else h += c.tradedToday
      ? `<span class="pill green">Đã đánh hôm nay ${signed(c.todayPnl)}</span>`
      : `<span class="pill yellow">Chưa đánh hôm nay</span>`;
    if (a.openOrder) h += orderBox(a, tradingDayAt(now()));
    h += dirLine(a);
    h += `<div class="c-btns"><button class="btn primary" data-action="record" data-id="${a.id}">Ghi kết quả</button>
          <button class="btn" data-action="order" data-id="${a.id}">${a.openOrder ? 'Sửa lệnh' : '+ Lệnh mở'}</button>
          <button class="btn" data-action="manage" data-id="${a.id}">Quản lý</button></div>`;
  } else {
    const nx = a.status === 'passed' && accById(a.nextId);
    if (a.status === 'passed') h += `<div class="alert green">✓ Đã pass ${PHASES[a.phase]}${a.passedDate ? ' ngày ' + fmtDay(a.passedDate) : ''}${nx ? ` → chuyển sang ${PHASES[nx.phase]} ${nx.loginId ? 'ID …' + esc(nx.login4) : '(chưa nhập ID)'}` : ''}</div>`;
    h += `<div class="c-btns" style="grid-template-columns:1fr"><button class="btn" data-action="manage" data-id="${a.id}">Quản lý</button></div>`;
  }
  return h + `</article>`;
}

// ---------- Chống đánh 1 chiều (Buy/Sell liên tiếp) ----------
// Xét các ngày đã đánh của tài khoản (trước ngày `beforeDay` nếu có), lấy chuỗi cùng hướng gần nhất
function dirState(a, beforeDay){
  const byDay = {};
  data.results.filter(r => r.accountId === a.id && r.kind !== 'adjust' && r.dir && (!beforeDay || r.tradingDay < beforeDay))
    .sort((x, y) => x.createdAt - y.createdAt).forEach(r => byDay[r.tradingDay] = r.dir);
  const days = Object.keys(byDay).sort();
  let dir = null, streak = 0;
  for (let i = days.length - 1; i >= 0; i--){
    if (!dir){ dir = byDay[days[i]]; streak = 1; }
    else if (byDay[days[i]] === dir) streak++;
    else break;
  }
  const max = Math.max(1, +S().DIR_MAX_STREAK || 2);
  const level = !dir ? 0 : streak >= max ? 2 : 1;           // 1 = nên đổi, 2 = bắt buộc đổi
  const counts = { L:0, S:0 }; Object.values(byDay).forEach(d => counts[d]++);
  return { dir, streak, level, need: dir ? (dir === 'L' ? 'S' : 'L') : null, counts,
           color: !dir ? DIR_COLORS.none : DIR_COLORS[dir + (level === 2 ? '2' : '1')] };
}
function dirColor(a){ return isLive(a) ? dirState(a).color : DIR_COLORS.none; }
function dirLine(a){
  const st = dirState(a);
  let h = '';
  if (st.level === 2) h += `<div class="alert red">⛔ Đã ${DIR_NAME[st.dir].toUpperCase()} ${st.streak} ngày liền → lệnh tiếp theo BẮT BUỘC <b>${DIR_NAME[st.need].toUpperCase()}</b></div>`;
  else if (st.level === 1) h += `<div class="alert yellow">↔ Lần trước ${DIR_NAME[st.dir]} → lệnh tiếp theo nên <b>${DIR_NAME[st.need]}</b></div>`;
  h += `<div class="dirline"><span>Chống đánh 1 chiều</span><span class="cnt">Buy <b class="L">${st.counts.L}</b> ngày · Sell <b class="S">${st.counts.S}</b> ngày</span></div>`;
  return h;
}
// Cảnh báo khi chọn hướng trùng với chuỗi đang có (dùng ở màn ghi lệnh / ghi kết quả)
function dirWarn(a, dir, day){
  if (!dir) return '';
  const st = dirState(a, day);
  if (!st.dir || dir !== st.dir) return '';
  return st.level === 2
    ? `<div class="alert red" style="margin:0 0 12px">⛔ Sai quy tắc chống đánh 1 chiều: đã ${DIR_NAME[st.dir]} ${st.streak} ngày liền, lệnh này phải là <b>${DIR_NAME[st.need]}</b>.</div>`
    : `<div class="alert yellow" style="margin:0 0 12px">↔ Lần trước cũng ${DIR_NAME[st.dir]}. Theo quy tắc nên đổi sang <b>${DIR_NAME[st.need]}</b>.</div>`;
}

// ---------- Trang thống kê ----------
const pct = x => (isFinite(x) ? Math.round(x * 1000) / 10 : 0) + '%';
const fx = (x, d = 2) => isFinite(x) ? x.toFixed(d) : '—';
function calcStats(trades){
  const t = trades.slice().sort((a, b) => a.tradingDay.localeCompare(b.tradingDay) || a.createdAt - b.createdAt);
  const wins = t.filter(r => r.pnl > 0), losses = t.filter(r => r.pnl < 0);
  const gw = wins.reduce((x, r) => x + +r.pnl, 0), gl = Math.abs(losses.reduce((x, r) => x + +r.pnl, 0));
  const net = r2(gw - gl), n = t.length, decided = wins.length + losses.length;
  const avgW = wins.length ? gw / wins.length : 0, avgL = losses.length ? gl / losses.length : 0;
  const rr = avgL ? avgW / avgL : (avgW ? Infinity : 0);
  // Chuỗi thắng/thua, sụt giảm lớn nhất của đường lãi lỗ cộng dồn
  let cw = 0, cl = 0, mw = 0, ml = 0, cum = 0, peak = 0, mdd = 0;
  const curve = [0];
  for (const r of t){
    if (r.pnl > 0){ cw++; cl = 0; } else if (r.pnl < 0){ cl++; cw = 0; } else { cw = 0; cl = 0; }
    mw = Math.max(mw, cw); ml = Math.max(ml, cl);
    cum += +r.pnl; curve.push(r2(cum)); peak = Math.max(peak, cum); mdd = Math.max(mdd, peak - cum);
  }
  const SLv = +S().SL || 1;
  const days = {}; t.forEach(r => days[r.tradingDay] = (days[r.tradingDay] || 0) + +r.pnl);
  const dv = Object.values(days);
  return {
    n, wins:wins.length, losses:losses.length, be:n - decided,
    winRate: decided ? wins.length / decided : 0,
    gw, gl, net, pf: gl ? gw / gl : (gw ? Infinity : 0),
    avgW, avgL, rr, exp: n ? net / n : 0,
    avgR: n ? t.reduce((x, r) => x + r.pnl / SLv, 0) / n : 0, totalR: t.reduce((x, r) => x + r.pnl / SLv, 0),
    best: n ? Math.max(...t.map(r => +r.pnl)) : 0, worst: n ? Math.min(...t.map(r => +r.pnl)) : 0,
    mw, ml, mdd: r2(mdd), curve, cw, cl,
    beWR: rr && isFinite(rr) ? 1 / (1 + rr) : 0,
    days: dv.length, greenDays: dv.filter(v => v > 0).length,
    bestDay: dv.length ? Math.max(...dv) : 0, worstDay: dv.length ? Math.min(...dv) : 0
  };
}
function kpi(k, v, sub, cls){ return `<div class="kpi"><div class="k">${k}</div><div class="v ${cls || ''}">${v}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>`; }
function equitySvg(curve){
  if (curve.length < 2) return '<div class="note">Cần ít nhất 1 lệnh để vẽ đường lãi lỗ.</div>';
  const W = 600, H = 180, P = 8, min = Math.min(0, ...curve), max = Math.max(0, ...curve), span = (max - min) || 1;
  const X = i => P + i * (W - 2 * P) / (curve.length - 1), Y = v => P + (max - v) * (H - 2 * P) / span;
  const pts = curve.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const last = curve[curve.length - 1], col = last >= 0 ? 'var(--green)' : 'var(--red)';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Đường lãi lỗ cộng dồn">
    <line x1="${P}" x2="${W - P}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
    <polygon points="${X(0)},${Y(0)} ${pts} ${X(curve.length - 1)},${Y(0)}" fill="${col}" opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(curve.length - 1)}" cy="${Y(last)}" r="5" fill="${col}"/>
  </svg>`;
}
function groupRows(groups){
  return groups.map(([name, list]) => {
    const st = calcStats(list);
    return `<tr><td>${name}</td><td>${st.n}</td><td>${st.n ? pct(st.winRate) : '—'}</td><td>${st.n ? fx(st.rr) : '—'}</td><td class="${st.net > 0 ? 'pos' : st.net < 0 ? 'neg' : ''}">${st.n ? signed(st.net) : '—'}</td></tr>`;
  }).join('');
}
function renderStats(){
  const accs = data.accounts;

      ${kpi('Tỷ lệ thắng (Win rate)', pct(st.winRate), `${st.wins} thắng · ${st.losses} thua${st.be ? ' · ' + st.be + ' hoà' : ''}`, st.winRate >= st.beWR ? 'pos' : 'neg')}
      ${kpi('RR thực tế (avg Win / avg Loss)', isFinite(st.rr) ? '1 : ' + fx(st.rr) : '∞', `Win rate hoà vốn: ${pct(st.beWR)}`)}

    h += `<section class="st-card"><h2>Chi tiết lệnh</h2><div class="kpis">

    const by = (keyFn, keys) => keys.map(([k, name]) => [name, trades.filter(r => keyFn(r) === k)]).filter(([, l]) => l.length);
    const head = `<tr><th></th><th>Lệnh</th><th>Win rate</th><th>RR</th><th>Lãi/lỗ</th></tr>`;
    h += `<section class="st-card"><h2>Long và Short</h2><table class="st-tbl">${head}${groupRows(by(r => r.dir, [['L','▲ Long'],['S','▼ Short']]))}</table></section>`;
    h += `<section class="st-card"><h2>Theo thứ trong tuần</h2><table class="st-tbl">${head}${groupRows(by(r => dow(r.tradingDay), [[1,'Thứ 2'],[2,'Thứ 3'],[3,'Thứ 4'],[4,'Thứ 5'],[5,'Thứ 6']]))}</table></section>`;

    ${kpi('Đang Funded', accs.filter(a => isLive(a) && a.phase === 'F').length, `${accs.filter(a => a.status === 'breached').length} tài khoản đã cháy`)}

  </div><div class="note">Tỷ lệ pass chỉ tính các tài khoản đã kết thúc vòng đó (đã pass hoặc đã cháy).</div></section>`;

}

// ---------- Trang Payout (lịch + số tiền) ----------
function shiftMonth(ym, n){ const [y, m] = ym.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1 + n, 1)); return t.toISOString().slice(0, 7); }
// Tỷ lệ chia lợi nhuận: dính Goat Guard 1 lần thì còn 50%
function paySplit(a){ return a && +a.goatGuardHits >= 1 ? 50 : +S().PAYOUT_SPLIT || 100; }
function payFee(){ return Math.max(0, +S().PAYOUT_FEE || 0); }
function payNet(a, amount){ return r2(amount * paySplit(a) / 100 * (1 - payFee() / 100)); }
// Đếm ngày làm việc (bỏ T7, CN) từ sau ngày `from` tới hết ngày `to`
function bizDaysBetween(from, to){
  let n = 0, d = from;
  while (d < to){ d = addDays(d, 1); const w = dow(d); if (w !== 0 && w !== 6) n++; }
  return n;
}
function addBizDays(from, n){ let d = from; while (n > 0){ d = addDays(d, 1); const w = dow(d); if (w !== 0 && w !== 6) n--; } return d; }
// Tình trạng rút tiền của 1 tài khoản Funded
function payInfo(a){
  const s = S(), today = localDate(now()), c = compute(a, tradingDayAt(now()));
  const pays = data.payouts.filter(p => p.accountId === a.id);
  const firstDate = a.fundedDate ? addDays(a.fundedDate, +s.PAYOUT_FIRST_DAYS || 14) : '';
  const cap = pays.length < 2 ? r2(a.size * s.PAYOUT_CAP / 100) : Infinity;   // 2 lần rút đầu có trần
  const can = Math.max(0, Math.min(c.profit, cap));
  const waitDays = firstDate && today < firstDate ? daysBetween(today, firstDate) : 0;
  const needDays = Math.max(0, c.minDays - c.winDays);
  const ok = !waitDays && !needDays && c.profit > 0;
  return { c, pays, firstDate, cap, can, waitDays, needDays, ok, split: paySplit(a) };
}

// ---------- Lưu lên mây (Supabase) + đăng nhập bằng mã cá nhân ----------
// Mã cá nhân không gửi đi nguyên văn: app băm (SHA-256) rồi mới dùng làm khoá lưu trữ.
const CLOUD = { url:String(CONFIG.CLOUD_URL || '').trim().replace(/\/+$/, ''), key:String(CONFIG.CLOUD_KEY || '').trim() };
const cloudOn = () => !!(CLOUD.url && CLOUD.key);
const CODE_KEY = 'gft-code';
const sess = { code:'', hash:'', ready:false, status:'idle', cloudAt:'', dirty:false, err:'' };
let pushTimer = null;
function normCode(c){ return String(c || '').trim().toLowerCase().replace(/\s+/g, ''); }
async function hashCode(c){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('gft-tracker:' + normCode(c)));
  return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
}
async function rpc(fn, body){
  const r = await fetch(`${CLOUD.url}/rest/v1/rpc/${fn}`, {
    method:'POST', headers:{ apikey:CLOUD.key, Authorization:'Bearer ' + CLOUD.key, 'Content-Type':'application/json' },
    body:JSON.stringify(body)
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
function cacheLocal(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); storageOk = true; } catch(e){ storageOk = false; } }
// Đẩy dữ liệu lên mây (gom nhiều lần sửa liên tiếp thành 1 lần gửi)
function schedulePush(){
  if (!cloudOn() || !sess.hash) return;
  sess.dirty = true; sess.status = 'saving';
  clearTimeout(pushTimer); pushTimer = setTimeout(pushNow, 700);
}
async function pushNow(){
  if (!sess.hash || !sess.dirty) return;
  try {
    const at = await rpc('gft_put', { p_hash:sess.hash, p_data:data });
    if (!at) throw new Error('Không tìm thấy tài khoản trên mây');
    sess.cloudAt = at; sess.dirty = false; sess.status = 'synced'; sess.err = '';
  } catch(e){ sess.status = 'offline'; sess.err = e.message; }
  renderSync();
}
// Lấy bản mới nhất trên mây (khi mở lại app / đổi máy)
async function pullLatest(force){
  if (!sess.hash) return;
  if (sess.dirty){ await pushNow(); if (sess.dirty) return; }
  try {
    const row = await rpc('gft_get', { p_hash:sess.hash });
    if (!row){ logout('Mã này không còn trên mây. Hãy đăng nhập lại.'); return; }
    if (force || row.updated_at !== sess.cloudAt){
      data = normalize(row.data); sess.cloudAt = row.updated_at; cacheLocal(); render();
    }
    sess.status = 'synced'; sess.err = '';
  } catch(e){ sess.status = 'offline'; sess.err = e.message; }
  renderSync();
}
function syncBadge(){
  if (!cloudOn() || !sess.hash) return '';
  const st = { saving:['⏳','Đang lưu…'], synced:['☁️','Đã lưu lên mây'], offline:['⚠️','Chưa lưu được — sẽ thử lại'], idle:['☁️','Đã kết nối'] }[sess.status] || ['☁️', ''];
  return `<button class="hbtn sync ${sess.status}" data-action="me" title="${st[1]}">${st[0]}</button>`;
}
function renderSync(){ const b = document.querySelector('.hbtn.sync'); if (b) b.outerHTML = syncBadge(); }
async function startSession(code, mode){
  const err = document.getElementById('lg-err');
  const c = normCode(code);
  if (c.length < 6){ err.textContent = 'Mã cá nhân cần ít nhất 6 ký tự (nên dùng cả chữ và số).'; return; }
  err.textContent = ''; document.querySelectorAll('.login .btn').forEach(b => b.disabled = true);
  try {
    const h = await hashCode(c);
    if (mode === 'create'){
      const keep = document.getElementById('lg-keep');
      const start = keep && keep.checked ? data : normalize(null);
      start.updatedAt = Date.now();
      const ok = await rpc('gft_create', { p_hash:h, p_data:start });
      if (!ok){ err.textContent = 'Mã này đã có người dùng. Chọn mã khác, hoặc bấm Đăng nhập nếu đó là mã của bạn.'; return; }
      data = normalize(start);
    } else {
      const row = await rpc('gft_get', { p_hash:h });
      if (!row){ err.textContent = 'Không tìm thấy mã này. Kiểm tra lại, hoặc bấm "Tạo tài khoản mới".'; return; }
      data = normalize(row.data); sess.cloudAt = row.updated_at;
    }
    Object.assign(sess, { code:c, hash:h, status:'synced', dirty:false });
    try { localStorage.setItem(CODE_KEY, c); } catch(e){}
    cacheLocal(); render();
    toast(mode === 'create' ? 'Đã tạo tài khoản. Dữ liệu sẽ tự lưu lên mây.' : 'Đăng nhập thành công');
    if (mode === 'create') pullLatest(true);
  } catch(e){
    err.textContent = 'Không kết nối được máy chủ (' + e.message + '). Kiểm tra mạng rồi thử lại.';
  } finally { document.querySelectorAll('.login .btn').forEach(b => b.disabled = false); }
}
function logout(msg){
  try { localStorage.removeItem(CODE_KEY); localStorage.removeItem(STORE_KEY); } catch(e){}
  Object.assign(sess, { code:'', hash:'', status:'idle', cloudAt:'', dirty:false });
  data = normalize(null); closeSheet(); ui.view = 'main'; render();
  if (msg) toast(msg);
}

async function bootCloud(){
  if (!cloudOn()) return;
  let code = ''; try { code = localStorage.getItem(CODE_KEY) || ''; } catch(e){}

// ---------- Lệnh đang mở (Limit chờ khớp / lệnh đang chạy) ----------
const ORDER_TYPES = {
  BL: { t:'Buy Limit',  dir:'L', pending:true },
  SL: { t:'Sell Limit', dir:'S', pending:true },
  B:  { t:'Buy',  dir:'L', pending:false },
  S:  { t:'Sell', dir:'S', pending:false }
};
function orderState(o){ return ORDER_TYPES[o.type].pending && !o.filled ? 'pending' : 'running'; }
function orderLabel(o){ const T = ORDER_TYPES[o.type]; return orderState(o) === 'pending' ? `⏳ ${T.t} — chờ khớp` : `▶ ${T.dir === 'L' ? 'Buy' : 'Sell'} — đang chạy`; }
function orderDetail(o){
  const p = [];
  if (o.entry) p.push('giá ' + o.entry); if (o.sl) p.push('SL ' + o.sl); if (o.tp) p.push('TP ' + o.tp); if (o.lot) p.push(o.lot + ' lot');

// Có tài khoản khác đang mở lệnh hoặc đã đánh hôm nay theo hướng ngược lại -> đối lệnh
function hedgeWith(accId, dir, today){
  const opp = dir === 'L' ? 'S' : 'L', out = [];
  for (const x of data.accounts){
    if (x.id === accId || !isLive(x)) continue;
    if (x.openOrder && ORDER_TYPES[x.openOrder.type].dir === opp) out.push(x.label);
    else if (data.results.some(r => r.accountId === x.id && r.kind !== 'adjust' && r.tradingDay === today && r.dir === opp)) out.push(x.label);
  }
  return out;
}
function orderBox(a, today){
  const o = a.openOrder, T = ORDER_TYPES[o.type], st = orderState(o), det = orderDetail(o);
  const old = o.tradingDay && o.tradingDay < today;
  const hedge = hedgeWith(a.id, T.dir, today);
  return `<div class="order ${st === 'running' ? 'run' : ''}">
    <div class="ot ${T.dir}">${orderLabel(o)}</div>
    ${det ? `<div class="od">${esc(det)}</div>` : ''}${o.note ? `<div class="od">${esc(o.note)}</div>` : ''}
    ${old ? `<div class="ow">⚠ Lệnh từ ${fmtDay(o.tradingDay)} — đang giữ qua đêm?</div>` : ''}
    ${hedge.length ? `<div class="ow">⚠ Ngược hướng với: ${esc(hedge.join(', '))}</div>` : ''}
  </div>`;
}
function ordersOverview(active, today){
  const list = active.filter(a => a.openOrder).sort((x, y) => (+x.order || 0) - (+y.order || 0));
  if (!list.length) return '';

}

function saveOrder(){
  keepOrderInputs();
  const r = ui.ord, a = accById(r.id); if (!r.type) return;

  a.openOrder = { type:r.type, entry:r.entry, sl:r.sl, tp:r.tp, lot:r.lot, note:r.note,
                  filled: sameKind ? !!prev.filled : false,
                  tradingDay: prev.tradingDay || tradingDayAt(now()), createdAt: prev.createdAt || Date.now() };

// ---------- Pass / Cháy ----------
const NEXT = { P1:'P2', P2:'F' };
const NEXT_NAME = { P1:'Vòng 2', P2:'Funded (tài khoản real)' };
function statusBlock(a){
  const c = compute(a, tradingDayAt(now()));
  let h = `<div class="idblock" style="--acc:${dirColor(a)};--on:${textOn(dirColor(a))}">
             <div class="l1">${esc(a.label)}</div>
             <div class="l2">${a.loginId ? 'ID …' + esc(a.login4) : 'chưa nhập ID'} · ${a.status === 'breached' ? 'Đã cháy (' + PHASES[a.phase] + ')' : a.status === 'passed' ? 'Đã pass ' + PHASES[a.phase] : PHASES[a.phase]} · số dư ${money(c.balance)}</div>
           </div>`;
  if (a.status === 'breached'){
    h += `<p class="hint">Tài khoản đã kết thúc${a.breachedDate ? ' ngày ' + fmtDay(a.breachedDate) : ''}, nằm ở mục <b>Cháy</b>. Nếu lỡ bấm nhầm thì khôi phục lại.</p>
          <button class="btn" data-action="acc-restore" data-id="${a.id}" data-confirm>↺ Khôi phục (bấm nhầm)</button>`;
    return h;
  }
  if (a.status === 'passed'){
    const nx = accById(a.nextId);
    h += `<p class="hint">Tài khoản này đã pass${a.passedDate ? ' ngày ' + fmtDay(a.passedDate) : ''} và đã đóng, nằm ở mục <b>Hoàn thành</b>.
          ${nx ? `Đang đánh tiếp ở tài khoản ${PHASES[nx.phase]} ${nx.loginId ? 'ID …' + esc(nx.login4) : '(chưa nhập ID)'}.` : ''}</p>`;
    if (nx && !data.results.some(r => r.accountId === nx.id))
      h += `<button class="btn" data-action="acc-unpass" data-id="${a.id}" data-confirm>↺ Hoàn tác pass (bấm nhầm)</button>`;
    return h;
  }
  if (a.phase !== 'F'){
    h += `<div class="field"><label for="f-newid">ID tài khoản ${NEXT_NAME[a.phase]} mới (GFT gửi qua mail)</label>
          <input id="f-newid" inputmode="numeric" placeholder="Dán ID mới vào đây" autocomplete="off">
          <div class="hint">Tài khoản ${PHASES[a.phase]} này sẽ chuyển sang <b>Hoàn thành</b>; app tạo tài khoản ${NEXT_NAME[a.phase]} mới, bắt đầu từ ${money(a.size)}. Chưa nhận mail thì để trống, dán ID sau ở Quản lý.</div>
          <div class="hint">${c.ready ? '<span class="pos">✓ Đã đủ điều kiện: đạt mục tiêu và đủ ngày lãi.</span>'
              : `<span class="neg">Chưa đủ điều kiện</span>: còn thiếu ${money(c.remain)}, ngày lãi ${c.winDays}/${c.minDays}. Chỉ bấm Pass khi GFT đã báo pass.`}</div></div>
          <div class="err" id="f-pass-err"></div>
          <button class="btn primary" style="background:var(--green)" data-action="acc-pass" data-id="${a.id}" data-confirm>✓ Pass → tạo tài khoản ${NEXT_NAME[a.phase]} mới${c.ready ? '' : ' (chưa đủ điều kiện)'}</button>`;
  }
  h += `<div style="height:10px"></div>
        <button class="btn danger" data-action="acc-breach" data-id="${a.id}" data-confirm>🔥 Cháy — kết thúc tài khoản này</button>`;
  return h;
}
function passAccount(id){
  const a = accById(id); if (!a || !NEXT[a.phase]) return;
  const nid = cleanId((document.getElementById('f-newid') || {}).value);
  const err = (nid && nid.length < 4) ? 'ID mới phải có ít nhất 4 chữ số.'
            : (nid && data.accounts.some(x => x.id !== id && x.loginId === nid)) ? 'ID mới này đã có ở tài khoản khác.' : '';
  if (err){ document.getElementById('f-pass-err').textContent = err; return; }
  // GFT đóng tài khoản cũ và gửi tài khoản mới: cũ -> Hoàn thành, tạo tài khoản mới hoàn toàn
  const today = localDate(now()), to = NEXT[a.phase];
  const nx = { id:uid(), label:a.label, loginId:nid, login4:last4(nid), size:a.size,
               cost:0,                       // tiền mua đã tính ở tài khoản Vòng 1, không cộng lại
               purchaseDate:a.purchaseDate, order:a.order, phase:to, status:'active',
               fundedDate: to === 'F' ? today : '', goatGuardHits:0, prevId:a.id, batchNo:a.batchNo || 0 };
  data.accounts.push(nx);
  Object.assign(a, { status:'passed', passedDate:today, nextId:nx.id }); delete a.openOrder;
  save(); closeSheet();
  toast(`🎉 ${a.label} pass ${PHASES[a.phase]} → đã tạo tài khoản ${NEXT_NAME[a.phase]} mới`);
}
function unpassAccount(id){
  const a = accById(id), nx = a && accById(a.nextId); if (!nx) return;
  if (data.results.some(r => r.accountId === nx.id)){ toast('Tài khoản mới đã có kết quả, không hoàn tác được.'); return; }
  data.accounts = data.accounts.filter(x => x.id !== nx.id);
  Object.assign(a, { status:'active', passedDate:'', nextId:'' });
  save(); closeSheet();
  toast(`Đã hoàn tác pass ${a.label}`);
}
function setBreached(id, on){
  const a = accById(id); if (!a) return;
  a.status = on ? 'breached' : 'active'; if (on) delete a.openOrder;
  a.breachedDate = on ? localDate(now()) : '';
  save(); closeSheet();
  toast(on ? `${a.label} đã chuyển vào mục Cháy` : `Đã khôi phục ${a.label}`);
}

// Các tài khoản mua chung 1 lô (bỏ tài khoản vòng sau tạo ra khi pass, vì chúng không tốn tiền mua)
function lotAccounts(a){
  return a && a.batchNo ? data.accounts.filter(x => x.batchNo === a.batchNo && !x.prevId).sort((x, y) => (+x.order || 0) - (+y.order || 0)) : [];
}
function autoLabel(size, i){ return `GFT ${sizeLabel(size)} #${data.accounts.length + 1 + i}`; }
// Danh sách tài khoản sẽ tạo từ ô dán ID (chế độ thêm)
function plannedAccounts(){
  const g = id => document.getElementById(id);
  const ids = parseIds(g('f-login').value);
  const size = +g('f-size').value;
  const fresh = ids.filter(x => !data.accounts.some(a => a.loginId === x));
  let k = 0;
  return ids.map(x => {
    const exists = data.accounts.find(a => a.loginId === x);
    if (exists) return { loginId:x, skip:`đã có (${exists.label}), bỏ qua` };
    const i = k++;
    return { loginId:x, label: fresh.length > 1 ? autoLabel(size, i) : (g('f-label').value.trim() || autoLabel(size, 0)) };
  });
}
function updateFormHints(){
  const f = ui.form; if (!f) return;
  const g = id => document.getElementById(id);
  const raw = g('f-login').value;
  if (!f.id){
    const plan = plannedAccounts(), fresh = plan.filter(p => !p.skip), n = fresh.length, multi = n > 1;
    g('f-label-wrap').hidden = multi;
    g('f-order-wrap').hidden = multi;
    // Trùng 4 số cuối thì bước xác nhận không phân biệt được
    const taken = {};
    data.accounts.filter(a => isLive(a) && a.login4).forEach(a => taken[a.login4] = a.label);
    const seen = {};
    g('f-preview').innerHTML = plan.length ? `<div class="list">${plan.map(p => {
      if (p.skip) return `<div class="pv skip"><span>ID ${idHtml(p.loginId)} — ${esc(p.skip)}</span></div>`;
      const l4 = last4(p.loginId), clash = taken[l4] || seen[l4]; seen[l4] = p.label;
      return `<div class="pv"><span><b>${esc(p.label)}</b> · ID ${idHtml(p.loginId)}
              ${clash ? `<span class="w"> · trùng 4 số cuối với ${esc(clash)}</span>` : ''}</span></div>`;
    }).join('')}</div>` : (raw.trim() ? `<div class="hint warn">Không thấy ID hợp lệ. ID phải là số login, ít nhất 4 chữ số.</div>` : '');
    g('f-save').textContent = multi ? `Thêm ${n} tài khoản` : 'Thêm tài khoản';
    g('f-cost-lbl').textContent = multi ? `Số tiền đã bỏ ra cho lô ${n} tài khoản ($)` : 'Số tiền đã bỏ ra ($)';
    const total = +g('f-cost').value || 0;
    g('f-cost-hint').textContent = multi && total ? `Chia đều: mỗi tài khoản ≈ ${money(total / n)}` : '';
  } else {
    const id = cleanId(raw);
    const dup = id && data.accounts.find(x => x.id !== f.id && isLive(x) && x.login4 === last4(id));
    const lh = g('f-login-hint');
    lh.textContent = dup ? `4 số cuối trùng với "${dup.label}". Bước xác nhận sẽ không phân biệt được 2 tài khoản.`
                         : 'Dùng 4 số cuối để xác nhận khi ghi kết quả, chống bấm nhầm tài khoản.';
    lh.className = 'hint' + (dup ? ' warn' : '');
  }
}
// Chia tổng tiền cho n tài khoản, cộng lại đúng bằng tổng (tính theo cent)
function splitCost(total, n){
  const cents = Math.round(total * 100), base = Math.floor(cents / n), rem = cents - base * n;
  return Array.from({ length:n }, (_, i) => (base + (i < rem ? 1 : 0)) / 100);
}
function saveAccount(){
  const f = ui.form, g = id => document.getElementById(id);
  const cost = g('f-cost').value === '' ? 0 : r2(g('f-cost').value);
  const purchaseDate = g('f-pdate').value || localDate(now());
  if (f.id){
    const label = g('f-label').value.trim();
    const loginId = cleanId(g('f-login').value);
    const order = Math.max(1, parseInt(g('f-order').value, 10) || 1);
    const err = !label ? 'Cần nhập tên tài khoản.'
              : (loginId && loginId.length < 4) ? 'ID phải có ít nhất 4 chữ số (hoặc để trống).'
              : (loginId && data.accounts.some(x => x.id !== f.id && x.loginId === loginId)) ? 'ID này đã có ở tài khoản khác.' : '';
    if (err){ g('f-err').textContent = err; return; }
    Object.assign(accById(f.id), { label, loginId, login4:last4(loginId), cost, purchaseDate, order });
    toast(`Đã lưu ${label}`);
  } else {
    const raw = g('f-login').value.trim();
    const plan = plannedAccounts().filter(p => !p.skip);
    if (raw && !plan.length){ g('f-err').textContent = parseIds(raw).length ? 'Các ID này đều đã có trong app.' : 'Không thấy ID hợp lệ (ít nhất 4 chữ số).'; return; }
    const size = +g('f-size').value, phase = g('f-phase').value;
    const fundedDate = phase === 'F' ? g('f-fdate').value : '';
    const list = plan.length ? plan : [{ loginId:'', label: g('f-label').value.trim() || autoLabel(size, 0) }];
    const shares = splitCost(cost, list.length);
    const batchNo = list.length > 1 ? data.accounts.reduce((m, x) => Math.max(m, +x.batchNo || 0), 0) + 1 : 0;
    let order = list.length > 1
      ? data.accounts.reduce((m, x) => Math.max(m, +x.order || 0), 0) + 1
      : Math.max(1, parseInt(g('f-order').value, 10) || 1);
    for (const p of list){
      data.accounts.push({ id:uid(), label:p.label, loginId:p.loginId, login4:last4(p.loginId), size, cost:shares.shift(), purchaseDate,
                           order:order++, phase, status:'active', fundedDate, goatGuardHits:0, batchNo });
    }
    toast(list.length > 1 ? `Đã thêm ${list.length} tài khoản` : `Đã thêm ${list[0].label}`);
  }
  closeSheet(); save();
}

// ---------- Sự kiện ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  // Thao tác nguy hiểm: bấm 2 lần mới thực hiện
  if (el.hasAttribute('data-confirm') && !el.classList.contains('armed')){
    el.classList.add('armed'); el.dataset.orig = el.textContent; el.textContent = 'Bấm lần nữa để xác nhận';
    setTimeout(() => { if (el.isConnected){ el.classList.remove('armed'); el.textContent = el.dataset.orig; } }, 4000);
    return;
  }
  const act = el.dataset.action, v = el.dataset.v, id = el.dataset.id;
  switch (act){
    case 'close': closeSheet(); break;
    case 'lg-in': startSession(document.getElementById('lg-code').value, 'login'); break;
    case 'lg-new': startSession(document.getElementById('lg-code').value, 'create'); break;
    case 'me': openMe(); break;
    case 'me-show': document.getElementById('me-code').textContent = sess.code; el.remove(); break;
    case 'me-sync': closeSheet(); pullLatest(false).then(() => toast(sess.status === 'synced' ? 'Đã đồng bộ' : 'Chưa kết nối được máy chủ')); break;
    case 'me-out': logout('Đã đăng xuất khỏi máy này'); break;
    case 'filter': ui.filter = v; render(); break;
    case 'view': ui.view = v; render(); scrollTo(0, 0); break;
    case 'theme': applyTheme(THEMES[(THEMES.indexOf(getTheme()) + 1) % 3]); render(); break;
    case 'st-phase': ui.stPhase = v; render(); break;
    case 'add-account': openAccountForm(null); break;
    case 'manage': openAccountForm(id); break;
    case 'record': openRecord(id); break;
    case 'rec-dir': ui.rec.dir = v; ui.rec.dirTouched = true; keepAmount(); renderRecord(); break;
    case 'rec-out':
      keepAmount();
      if (v === 'L'){ ui.rec.amount = String(slFor(accById(ui.rec.id))); ui.rec.autoAmount = true; }
      else {
        // Thắng: tự điền TP theo kế hoạch (sửa được)
        const pc = compute(accById(ui.rec.id), ui.rec.day);
        if (pc.planTP && (ui.rec.autoAmount || !ui.rec.amount)){ ui.rec.amount = String(pc.planTP); ui.rec.autoAmount = true; }
        else if (ui.rec.autoAmount){ ui.rec.amount = ''; ui.rec.autoAmount = false; }
      }
      ui.rec.out = v; renderRecord();
      if (v === 'W') document.getElementById('r-amt').focus();
      break;
    case 'rec-save': saveRecord(); break;
    case 'order': openOrderForm(id); break;
    case 'ord-type': keepOrderInputs(); ui.ord.type = v; renderOrder(); break;
    case 'ord-save': saveOrder(); break;
    case 'ord-fill': { const a = accById(ui.ord.id); a.openOrder.filled = true; closeSheet(); save(); toast(`${a.label}: lệnh đã khớp, đang chạy`); break; }
    case 'ord-cancel': { const a = accById(ui.ord.id); delete a.openOrder; closeSheet(); save(); toast(`${a.label}: đã xoá lệnh mở`); break; }
    case 'ord-close': { const aid = ui.ord.id; closeSheet(); openRecord(aid); break; }
    case 'pay-new': openPayoutForm(id || ''); break;
    case 'pay-save': savePayout(); break;
    case 'pay-paid': { const pp = data.payouts.find(x => x.id === id); if (pp){ pp.status = 'paid'; pp.paidDate = localDate(now()); save(); toast(`Đã đánh dấu payout ${money(pp.received ?? pp.amount)} đã về`); } break; }
    case 'pay-del': data.payouts = data.payouts.filter(x => x.id !== id); save(); toast('Đã xoá payout'); break;
    case 'pay-month': ui.payMonth = shiftMonth(ui.payMonth || localDate(now()).slice(0, 7), +v); render(); break;
    case 'pay-st': ui.pay.status = v; keepPayInputs(); renderPayForm(); break;
    case 'acc-save': saveAccount(); break;
    case 'lot-save': {
      const a = accById(id), lot = lotAccounts(a), total = r2(document.getElementById('f-lot').value);
      if (!(total >= 0) || !lot.length) break;
      const shares = splitCost(total, lot.length);
      lot.forEach(x => x.cost = shares.shift());
      save(); openAccountForm(id);
      toast(`Đã sửa tổng tiền lô ${a.batchNo} thành ${money(total)}`);
      break;
    }
    case 'acc-pass': passAccount(id); break;
    case 'acc-breach': setBreached(id, true); break;
    case 'acc-restore': setBreached(id, false); break;
    case 'acc-unpass': unpassAccount(id); break;
    case 'copy-id': copyText(v).then(ok => toast(ok ? `Đã sao chép ID ${v}` : 'Không sao chép được, hãy giữ ngón tay lên số để copy')); break;
    case 'paste-ids':
      if (!navigator.clipboard || !navigator.clipboard.readText){ toast('Máy không cho đọc bộ nhớ. Hãy giữ ngón tay trong ô rồi chọn Dán.'); break; }
      navigator.clipboard.readText().then(txt => {
        const box = document.getElementById('f-login'); if (!box) return;
        box.value = (box.value.trim() ? box.value.trim() + '\n' : '') + txt;
        updateFormHints();
      }).catch(() => toast('Máy không cho đọc bộ nhớ. Hãy giữ ngón tay trong ô rồi chọn Dán.'));
      break;
    case 'res-del': {
      const accId = (data.results.find(r => r.id === id) || {}).accountId;
      data.results = data.results.filter(r => r.id !== id); save();
      if (accId) openAccountForm(accId);
      toast('Đã xoá kết quả');
      break;
    }
  }
});
function keepAmount(){ const el = document.getElementById('r-amt'); if (el && el.value !== ui.rec.amount){ ui.rec.amount = el.value; ui.rec.autoAmount = false; } }

document.addEventListener('input', e => {
  const t = e.target;
  if (ui.rec && t.id === 'r-amt'){ ui.rec.amount = t.value; ui.rec.autoAmount = false; updateRecord(); }
  if (ui.rec && t.id === 'r-fee'){ ui.rec.fee = t.value; updateRecord(); }
  if (ui.pay && t.id === 'p-amt' && !ui.pay.recvTouched){ const rv = document.getElementById('p-recv'); rv.value = t.value ? payNet(accById(document.getElementById('p-acc').value), +t.value) : ''; }
  if (ui.pay && t.id === 'p-recv') ui.pay.recvTouched = true;
  if (ui.form){
    if (t.id === 'f-login' || t.id === 'f-label') updateFormHints();
    if (t.id === 'f-cost') updateFormHints();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'st-acc'){ ui.stAcc = t.value; render(); return; }
  if (ui.rec && t.id === 'r-day' && t.value){
    keepAmount();
    ui.rec.day = t.value;
    if (!ui.rec.dirTouched) ui.rec.dir = defaultDir(t.value);
    renderRecord();
  }
  if (ui.form && t.id === 'f-size'){ document.getElementById('f-label').placeholder = autoLabel(+t.value, 0); updateFormHints(); }
  if (ui.pay && t.id === 'p-acc'){ keepPayInputs(); ui.pay.accId = t.value; renderPayForm(); }
  if (ui.form && t.id === 'f-phase') document.getElementById('f-fdate-wrap').hidden = t.value !== 'F';
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('sheet').hidden) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'lg-code') startSession(e.target.value, 'login');
});
// Tự cập nhật khi sang ngày giao dịch mới hoặc khi mở lại app trên điện thoại
// Không vẽ lại khi đang gõ ở màn đăng nhập (tránh mất chữ đang nhập)
const typingLogin = () => document.activeElement && document.activeElement.id === 'lg-code';
setInterval(() => { if (!document.hidden && !typingLogin()) render(); }, 30000);
// Mở lại app / quay lại tab: lấy bản mới nhất trên mây (trường hợp vừa sửa ở máy khác)
document.addEventListener('visibilitychange', () => { if (!document.hidden && !typingLogin()){ render(); pullLatest(false); } });
setInterval(() => { if (!document.hidden && sess.hash && document.getElementById('sheet').hidden) pullLatest(false); }, 60000);
window.addEventListener('online', () => { if (sess.dirty) pushNow(); else pullLatest(false); });

if (cloudOn()) bootCloud(); else render();
</script>
